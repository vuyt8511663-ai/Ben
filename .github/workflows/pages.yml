name: Deploy Taiwan Nearshore Fish Analyzer

on:
  push:
    branches: [main]
    paths:
      - 'deploy-parts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild and verify website archive
        run: |
          test -d deploy-parts
          cat deploy-parts/part-*.b64 | tr -d '\n' | base64 -d > site-source.zip
          unzip -tq site-source.zip
          mkdir site
          unzip -q site-source.zip -d site
          test -s site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          touch site/.nojekyll
      - name: Add species-specific fish photos
        run: |
          cat > site/fish-images.js <<'EOF'
          (() => {
            const memory = new Map();
            const STORE = 'nearshore-fish-photo-v2';
            function readStore() {
              try { return JSON.parse(localStorage.getItem(STORE) || '{}'); }
              catch (_) { return {}; }
            }
            const saved = readStore();
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
            async function photoFor(name) {
              if (memory.has(name)) return memory.get(name);
              if (saved[name]) {
                memory.set(name, Promise.resolve(saved[name]));
                return saved[name];
              }
              const task = (async () => {
                try {
                  const endpoint = 'https://api.inaturalist.org/v1/taxa?q=' +
                    encodeURIComponent(name) + '&rank=species&per_page=10';
                  const response = await fetch(endpoint);
                  if (!response.ok) return null;
                  const data = await response.json();
                  const taxon = (data.results || []).find(item =>
                    String(item.name || '').toLowerCase() === name.toLowerCase()
                  );
                  if (!taxon) return null;
                  let url = taxon.default_photo && taxon.default_photo.medium_url;
                  if (!url) {
                    const obs = await fetch('https://api.inaturalist.org/v1/observations?taxon_id=' +
                      taxon.id + '&photos=true&per_page=1&order_by=quality_grade');
                    if (obs.ok) {
                      const found = await obs.json();
                      const photo = found.results?.[0]?.photos?.[0];
                      url = photo?.url ? photo.url.replace('square.', 'medium.') : null;
                    }
                  }
                  if (url) {
                    url = url.replace(/^http:/, 'https:');
                    saved[name] = url;
                    try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (_) {}
                  }
                  return url || null;
                } catch (_) { return null; }
              })();
              memory.set(name, task);
              return task;
            }
            async function renderPhotos() {
              const names = [...document.querySelectorAll('.fishcard .latin')];
              for (let offset = 0; offset < names.length; offset += 3) {
                const batch = names.slice(offset, offset + 3);
                await Promise.all(batch.map(async nameNode => {
                  const card = nameNode.closest('.fishcard');
                  const visual = card?.querySelector('.fishvisual');
                  const name = (nameNode.textContent || '').trim();
                  if (!visual || !name || name === '學名未提供' || /\\bspp\\./i.test(name) ||
                      visual.dataset.photoLookup === 'done' || visual.dataset.photoLookup === 'loading' ||
                      visual.dataset.photoLookup === 'unavailable') return;
                  visual.dataset.photoLookup = 'loading';
                  const url = await photoFor(name);
                  if (!url || !visual.isConnected) {
                    visual.dataset.photoLookup = 'unavailable';
                    return;
                  }
                  const img = document.createElement('img');
                  img.src = url;
                  img.alt = name + ' 外觀照片';
                  img.loading = 'lazy';
                  img.decoding = 'async';
                  img.referrerPolicy = 'no-referrer';
                  img.style.objectFit = 'contain';
                  img.style.padding = '7px';
                  img.onload = () => { visual.dataset.photoLookup = 'done'; };
                  img.onerror = () => {
                    img.remove();
                    visual.dataset.photoLookup = 'unavailable';
                  };
                  const badge = visual.querySelector('small');
                  visual.textContent = '';
                  visual.appendChild(img);
                  if (badge) visual.appendChild(badge);
                }));
                if (offset + 3 < names.length) await wait(250);
              }
            }
            function start() {
              renderPhotos();
              const grid = document.getElementById('fishGrid') || document.body;
              new MutationObserver(() => renderPhotos()).observe(grid, {childList:true,subtree:true});
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true});
            else start();
          })();
          EOF
          printf '\n<script src="./fish-images.js" defer></script>\n' >> site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Trigger deployment after enabling GitHub Pages in repository settings.
