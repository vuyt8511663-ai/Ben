name: Deploy Taiwan Nearshore Fish Analyzer

on:
  push:
    branches: [main]
    paths:
      - 'deploy-parts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild and verify website archive
        run: |
          test -d deploy-parts
          cat deploy-parts/part-*.b64 | tr -d '\n' | base64 -d > site-source.zip
          unzip -tq site-source.zip
          mkdir site
          unzip -q site-source.zip -d site
          test -s site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          touch site/.nojekyll
      - name: Add species-specific fish photos
        run: |
          cat > site/fish-images.js <<'EOF'
          (() => {
            const photoCache = new Map();
            async function photoFor(scientificName) {
              if (photoCache.has(scientificName)) return photoCache.get(scientificName);
              const request = (async () => {
                try {
                  const endpoint = 'https://api.inaturalist.org/v1/taxa?q=' +
                    encodeURIComponent(scientificName) + '&rank=species&per_page=10';
                  const response = await fetch(endpoint);
                  if (!response.ok) return null;
                  const data = await response.json();
                  const taxon = (data.results || []).find(item =>
                    String(item.name || '').toLowerCase() === scientificName.toLowerCase()
                  );
                  if (!taxon) return null;
                  if (taxon.default_photo && taxon.default_photo.medium_url) {
                    return taxon.default_photo.medium_url.replace(/^http:/, 'https:');
                  }
                  const observations = await fetch(
                    'https://api.inaturalist.org/v1/observations?taxon_id=' +
                    taxon.id + '&photos=true&per_page=1&order_by=quality_grade'
                  );
                  if (!observations.ok) return null;
                  const found = await observations.json();
                  const photo = found.results && found.results[0] &&
                    found.results[0].photos && found.results[0].photos[0];
                  return photo && photo.url ? photo.url.replace('square.', 'medium.').replace(/^http:/, 'https:') : null;
                } catch (_) { return null; }
              })();
              photoCache.set(scientificName, request);
              return request;
            }
            async function renderPhotos() {
              const names = document.querySelectorAll('.fishcard .latin');
              const jobs = [];
              for (const nameNode of names) {
                const card = nameNode.closest('.fishcard');
                const visual = card && card.querySelector('.fishvisual');
                const scientificName = (nameNode.textContent || '').trim();
                if (!visual || !scientificName || scientificName === '學名未提供' ||
                    /\\bspp\\./i.test(scientificName) || visual.dataset.photoLookup === 'done' ||
                    visual.dataset.photoLookup === 'loading') continue;
                visual.dataset.photoLookup = 'loading';
                jobs.push((async () => {
                  const url = await photoFor(scientificName);
                  if (!url || !visual.isConnected) {
                    visual.dataset.photoLookup = 'unavailable';
                    return;
                  }
                  const img = document.createElement('img');
                  img.src = url;
                  img.alt = scientificName + ' 外觀照片';
                  img.loading = 'lazy';
                  img.decoding = 'async';
                  img.referrerPolicy = 'no-referrer';
                  img.style.objectFit = 'contain';
                  img.style.padding = '7px';
                  img.onload = () => { visual.dataset.photoLookup = 'done'; };
                  img.onerror = () => {
                    img.remove();
                    visual.dataset.photoLookup = 'unavailable';
                  };
                  const badge = visual.querySelector('small');
                  visual.textContent = '';
                  visual.appendChild(img);
                  if (badge) visual.appendChild(badge);
                })());
              }
              await Promise.all(jobs);
            }
            function start() {
              renderPhotos();
              const grid = document.getElementById('fishGrid') || document.body;
              new MutationObserver(() => renderPhotos()).observe(grid, {childList:true,subtree:true});
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true});
            else start();
          })();
          EOF
          printf '\n<script src="./fish-images.js" defer></script>\n' >> site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Trigger deployment after enabling GitHub Pages in repository settings.
