name: Deploy Taiwan Nearshore Fish Analyzer

on:
  push:
    branches: [main]
    paths:
      - 'deploy-parts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild and verify website archive
        run: |
          test -d deploy-parts
          cat deploy-parts/part-*.b64 | tr -d '\n' | base64 -d > site-source.zip
          unzip -tq site-source.zip
          mkdir site
          unzip -q site-source.zip -d site
          test -s site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          touch site/.nojekyll
      - name: Add species-specific fish photos
        run: |
          cat > site/fish-images.js <<'EOF'
          (() => {
            const cache = new Map();
            const photoFor = async (scientificName) => {
              if (cache.has(scientificName)) return cache.get(scientificName);
              const task = fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(scientificName.replace(/ /g, '_')))
                .then(r => r.ok ? r.json() : null)
                .then(data => data && data.thumbnail && data.thumbnail.source ? data.thumbnail.source : null)
                .catch(() => null);
              cache.set(scientificName, task);
              return task;
            };
            const addPhotos = async () => {
              const nodes = Array.from(document.querySelectorAll('i, em')).filter(el =>
                /^[A-Z][a-z-]+ [a-z-]+$/.test((el.textContent || '').trim())
              );
              for (const nameNode of nodes) {
                const scientificName = nameNode.textContent.trim();
                if (nameNode.dataset.speciesPhotoDone) continue;
                nameNode.dataset.speciesPhotoDone = '1';
                const url = await photoFor(scientificName);
                if (!url) continue;
                let card = nameNode.closest('[class*="card"], article, li');
                if (!card) {
                  card = nameNode.parentElement;
                  for (let i = 0; i < 5 && card && card.parentElement; i++) {
                    const rect = card.getBoundingClientRect();
                    if (rect.width >= 180 && rect.width <= 600 && rect.height >= 180) break;
                    card = card.parentElement;
                  }
                }
                if (!card || card.querySelector('[data-species-photo]')) continue;
                const rect = card.getBoundingClientRect();
                if (rect.width < 180) continue;
                if (getComputedStyle(card).position === 'static') card.style.position = 'relative';
                const img = document.createElement('img');
                img.src = url;
                img.alt = scientificName;
                img.loading = 'lazy';
                img.decoding = 'async';
                img.dataset.speciesPhoto = '1';
                Object.assign(img.style, {
                  position: 'absolute', top: '28px', left: '50%',
                  transform: 'translateX(-50%)', width: '112px', height: '112px',
                  objectFit: 'contain', zIndex: '3', pointerEvents: 'none',
                  filter: 'drop-shadow(0 3px 5px rgba(0,0,0,.18))'
                });
                card.appendChild(img);
                card.style.overflow = 'hidden';
              }
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addPhotos);
            else addPhotos();
            new MutationObserver(() => addPhotos()).observe(document.documentElement, {childList:true,subtree:true});
          })();
          EOF
          printf '\n<script src="./fish-images.js" defer></script>\n' >> site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Trigger deployment after enabling GitHub Pages in repository settings.
