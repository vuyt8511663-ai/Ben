name: Deploy Taiwan Nearshore Fish Analyzer

on:
  push:
    branches: [main]
    paths:
      - 'deploy-parts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild and verify website archive
        run: |
          test -d deploy-parts
          cat deploy-parts/part-*.b64 | tr -d '\n' | base64 -d > site-source.zip
          unzip -tq site-source.zip
          mkdir site
          unzip -q site-source.zip -d site
          test -s site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          touch site/.nojekyll
      - name: Add species-specific fish photos
        run: |
          cat > site/fish-images.js <<'EOF'
          (() => {
            const photoCache = new Map();
            async function photoFor(scientificName) {
              if (photoCache.has(scientificName)) return photoCache.get(scientificName);
              const request = fetch('https://api.inaturalist.org/v1/taxa?q=' + encodeURIComponent(scientificName) + '&rank=species&per_page=10')
                .then(response => response.ok ? response.json() : null)
                .then(data => {
                  const exact = (data && data.results || []).find(item =>
                    String(item.name || '').toLowerCase() === scientificName.toLowerCase() &&
                    item.default_photo && item.default_photo.medium_url
                  );
                  return exact ? exact.default_photo.medium_url.replace(/^http:/, 'https:') : null;
                })
                .catch(() => null);
              photoCache.set(scientificName, request);
              return request;
            }
            async function renderPhotos() {
              const names = document.querySelectorAll('.fishcard .latin');
              for (const nameNode of names) {
                const card = nameNode.closest('.fishcard');
                const visual = card && card.querySelector('.fishvisual');
                const scientificName = (nameNode.textContent || '').trim();
                if (!visual || !scientificName || scientificName === '學名未提供' ||
                    /\\bspp\\./i.test(scientificName) || visual.dataset.photoLookup === 'done') continue;
                visual.dataset.photoLookup = 'done';
                const url = await photoFor(scientificName);
                if (!url || !visual.isConnected) continue;
                const img = document.createElement('img');
                img.src = url;
                img.alt = scientificName + ' 外觀照片';
                img.loading = 'lazy';
                img.decoding = 'async';
                img.referrerPolicy = 'no-referrer';
                img.style.objectFit = 'contain';
                img.style.padding = '7px';
                img.onerror = () => {
                  img.remove();
                  visual.dataset.photoLookup = 'unavailable';
                };
                const badge = visual.querySelector('small');
                visual.textContent = '';
                visual.appendChild(img);
                if (badge) visual.appendChild(badge);
              }
            }
            function start() {
              renderPhotos();
              new MutationObserver(() => renderPhotos()).observe(document.getElementById('fishGrid') || document.body, {childList:true,subtree:true});
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true});
            else start();
          })();
          EOF
          printf '\n<script src="./fish-images.js" defer></script>\n' >> site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Trigger deployment after enabling GitHub Pages in repository settings.
