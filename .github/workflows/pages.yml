name: Deploy Taiwan Nearshore Fish Analyzer

on:
  push:
    branches: [main]
    paths:
      - 'deploy-parts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild and verify website archive
        run: |
          test -d deploy-parts
          cat deploy-parts/part-*.b64 | tr -d '\n' | base64 -d > site-source.zip
          unzip -tq site-source.zip
          mkdir site
          unzip -q site-source.zip -d site
          test -s site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          touch site/.nojekyll
      - name: Add licensed fish photos with attribution
        run: |
          cat > site/fish-images.js <<'EOF'
          (() => {
            const memory = new Map();
            const STORE = 'nearshore-fish-photo-v4';
            const saved = (() => { try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (_) { return {}; } })();
            const allowed = new Set(['cc0','cc-by','cc-by-sa']);
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            async function lookup(name) {
              if (memory.has(name)) return memory.get(name);
              if (saved[name]) return saved[name];
              const task = (async () => {
                try {
                  const response = await fetch('https://api.inaturalist.org/v1/taxa?q=' + encodeURIComponent(name) + '&rank=species&per_page=10');
                  if (!response.ok) return null;
                  const data = await response.json();
                  const taxon = (data.results || []).find(x => String(x.name || '').toLowerCase() === name.toLowerCase());
                  if (!taxon) return null;
                  const candidates = [];
                  if (taxon.default_photo) candidates.push({
                    url: taxon.default_photo.medium_url || taxon.default_photo.url,
                    attribution: taxon.default_photo.attribution || 'iNaturalist',
                    license: taxon.default_photo.license_code
                  });
                  const obsResponse = await fetch('https://api.inaturalist.org/v1/observations?taxon_id=' + taxon.id + '&photos=true&photo_license=cc0,cc-by,cc-by-sa&per_page=30&order_by=quality_grade');
                  if (obsResponse.ok) {
                    const observations = await obsResponse.json();
                    for (const observation of observations.results || []) {
                      for (const photo of observation.photos || []) candidates.push({
                        url: photo.url ? photo.url.replace('square.', 'medium.') : null,
                        attribution: photo.attribution || observation.user?.login || 'iNaturalist',
                        license: photo.license_code
                      });
                    }
                  }
                  const photo = candidates.find(p => p.url && allowed.has(String(p.license || '').toLowerCase()));
                  if (!photo) return null;
                  const result = {url:photo.url.replace(/^http:/,'https:'), attribution:photo.attribution, license:photo.license};
                  saved[name] = result;
                  try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (_) {}
                  return result;
                } catch (_) { return null; }
              })();
              memory.set(name, task);
              return task;
            }
            async function render() {
              const nodes = [...document.querySelectorAll('.fishcard .latin')];
              for (let i=0; i<nodes.length; i+=3) {
                await Promise.all(nodes.slice(i,i+3).map(async node => {
                  const card=node.closest('.fishcard'), visual=card?.querySelector('.fishvisual');
                  const name=(node.textContent||'').trim();
                  if (!visual || !name || name==='學名未提供' || /\\bspp\\./i.test(name) || ['done','loading','none'].includes(visual.dataset.photoLookup)) return;
                  visual.dataset.photoLookup='loading';
                  const photo=await lookup(name);
                  if (!photo || !visual.isConnected) { visual.dataset.photoLookup='none'; return; }
                  const img=document.createElement('img');
                  img.src=photo.url; img.alt=name+' 魚種照片'; img.loading='lazy'; img.decoding='async'; img.referrerPolicy='no-referrer';
                  Object.assign(img.style,{display:'block',width:'100%',height:'100%',boxSizing:'border-box',objectFit:'contain',padding:'8px 8px 22px',maxWidth:'100%',maxHeight:'100%'});
                  img.onload=()=>{visual.dataset.photoLookup='done';};
                  img.onerror=()=>{img.remove();visual.dataset.photoLookup='none';};
                  const badge=visual.querySelector('small'); visual.textContent=''; visual.appendChild(img);
                  if (badge) visual.appendChild(badge);
                  const credit=document.createElement('span');
                  credit.textContent='照片：'+photo.attribution+'（'+photo.license+'）';
                  Object.assign(credit.style,{position:'absolute',left:'6px',right:'6px',bottom:'3px',zIndex:'2',display:'block',maxHeight:'18px',overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis',fontSize:'8px',lineHeight:'18px',padding:'0 5px',borderRadius:'5px',background:'rgba(255,255,255,.78)',color:'#31545a',textAlign:'center',boxSizing:'border-box',pointerEvents:'none'});
                  visual.appendChild(credit);
                }));
                if(i+3<nodes.length) await sleep(250);
              }
            }
            function start(){render();new MutationObserver(render).observe(document.getElementById('fishGrid')||document.body,{childList:true,subtree:true});}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
          })();
          EOF
          printf '\n<script src="./fish-images.js" defer></script>\n' >> site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Trigger deployment after enabling GitHub Pages in repository settings.
